<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rola</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rola">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell. Header, scrolling content, floating mini player, 4-tab bar; full-screen player sheet tinted by the cover. */
:root{
  --bg:#F5F4F7;--surface:#FFFFFF;--surface2:#EBE9EF;--fg:#16141B;--muted:#6A6674;--line:#E1DDE7;
  --accent:#C2366E;--on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(22,10,30,.06),0 8px 22px rgba(22,10,30,.08);
  --f-display:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D11;--surface:#18161D;--surface2:#24212A;--fg:#F3F1F6;--muted:#9C97A6;--line:#2C2834;
  --accent:#F0619D;--on-accent:#17060E;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D11;--surface:#18161D;--surface2:#24212A;--fg:#F3F1F6;--muted:#9C97A6;--line:#2C2834;
  --accent:#F0619D;--on-accent:#17060E;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}
[hidden]{display:none!important}
img{max-width:100%}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 8px;flex:none}
.top h1{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;flex:none;cursor:pointer}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;overscroll-behavior:contain}
.h2{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.h2:first-child{margin-top:6px}
.h2 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.rows{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 12px;min-height:58px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.thumb{width:44px;height:44px;border-radius:9px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-weight:600}
.thumb img,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.txt{flex:1;min-width:0}
.t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);margin-top:1px}
.num{width:22px;text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.cnt{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.chev{color:var(--muted);flex:none;padding-right:6px}
.row.playing .t1{color:var(--accent)}
.more{width:38px;height:38px;border:0;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.more svg{width:20px;height:20px;fill:currentColor}
.star{color:var(--muted)}.star.on{color:var(--accent)}
.star svg{fill:none;stroke:currentColor;stroke-width:2}.star.on svg{fill:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:18px 14px}
.tile{cursor:pointer;min-width:0;border:0;background:none;padding:0;text-align:left}
.cover{aspect-ratio:1;width:100%;max-width:100%;border-radius:12px;background:var(--surface2);overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted)}
.cover svg{width:34%;height:34%;fill:none;stroke:currentColor;stroke-width:1.5}
.tile .t1{margin-top:8px;font-weight:600;font-size:14px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:136px;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip>*{scroll-snap-align:start}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 130px;height:46px;border-radius:12px;border:0;background:var(--surface2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:6px 0 18px}
.hero .cover{width:min(62vw,250px);border-radius:16px}
.hero h2{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:12px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;color:var(--accent);font-weight:600}
.hero .meta{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0 14px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:16px var(--f-body)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.note{color:var(--muted);font-size:13px;margin:10px 2px}
.empty{background:var(--surface);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.empty h2{font-family:var(--f-display);font-size:22px;margin:0}
.empty ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.empty b{color:var(--fg);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:#D7263D;border-radius:6px;padding:3px 7px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.banner{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.skeleton{height:58px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.mini{margin:0 8px 6px;flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.mini .thumb{width:46px;height:46px}
.mini .ctl{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;border-radius:50%;cursor:pointer;flex:none}
.mini .ctl svg{width:24px;height:24px;fill:currentColor}
.mini .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);flex:none}
.tab{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.2}

.player{position:fixed;inset:0;z-index:20;isolation:isolate;color:#fff;background:#0D0C10;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  transform:translateY(0);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.player.off{transform:translateY(105%)}
.pl-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;background:var(--tint,#2A1F2E)}
.pl-bg img{width:100%;height:100%;object-fit:cover;filter:blur(50px) saturate(1.5);transform:scale(1.4);opacity:.7}
.pl-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,12,.25),rgba(10,8,12,.75) 70%,rgba(10,8,12,.9))}
.pl-in{max-width:520px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.pl-head{display:flex;align-items:center;justify-content:space-between}
.pl-head .icon-btn{background:rgba(255,255,255,.14);color:#fff}
.pl-src{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.75;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.pl-art{width:min(100%,46vh,400px);aspect-ratio:1;max-width:100%;margin:auto;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 30px 60px rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .3s}
.pl-art img{width:100%;height:100%;object-fit:cover}
.pl-art svg{width:30%;height:30%;fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.5}
.player.paused .pl-art{transform:scale(.9)}
.pl-meta{display:flex;align-items:center;gap:12px}
.pl-meta .txt{min-width:0}
.pl-t{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-s{color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pl-meta .more,.pl-meta .star{color:rgba(255,255,255,.8)}
.pl-meta .star.on{color:#fff}
.scrub{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:24px;margin:0;cursor:pointer}
.scrub::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px;border:0}
.scrub::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.scrub::-moz-range-progress{height:5px;border-radius:3px;background:#fff}
.scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;margin-top:-4px}
.ctrls{display:grid;grid-template-columns:1fr 1.2fr 1.5fr 1.2fr 1fr;align-items:center;justify-items:center}
.cb{border:0;background:none;color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.cb svg{width:30px;height:30px;fill:currentColor}
.cb.sm svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb.sm{opacity:.55;position:relative}
.cb.sm.on{opacity:1}
.cb.sm .badge{position:absolute;bottom:8px;right:8px;font-size:9px;font-weight:700}
.cb.big{width:74px;height:74px;background:#fff;color:#111}
.cb.big svg{width:32px;height:32px}
.pl-foot{display:flex;justify-content:space-around}
.pl-foot button{border:0;background:none;color:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;cursor:pointer;padding:6px 10px}
.pl-foot svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pl-foot .on{color:#fff}
.radio-only{display:none}.player.radio .radio-only{display:flex}.player.radio .local-only{visibility:hidden}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,6,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-p{width:100%;max-width:560px;max-height:78%;overflow-y:auto;background:var(--surface);color:var(--fg);border-radius:22px 22px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 14px)}
.sheet-p::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.s-head{display:flex;gap:12px;align-items:center;padding:0 18px 12px;border-bottom:1px solid var(--line)}
.s-head .t1{font-weight:600}
.s-item{display:flex;align-items:center;gap:14px;width:100%;padding:0 18px;min-height:52px;border:0;background:none;text-align:left;font-size:16px;cursor:pointer;border-bottom:1px solid var(--line)}
.s-item:last-child{border-bottom:0}
.s-item:active{background:var(--surface2)}
.s-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.s-item .grow{flex:1;min-width:0}
.s-item .val{color:var(--muted);font-size:14px}
.s-item.danger{color:#D7263D}.s-item.danger svg{color:#D7263D}
.eqwrap{padding:4px 18px 0;transition:opacity .2s}
.eqwrap .chips{margin:6px 0 10px}
.eqrow{display:grid;grid-template-columns:38px 1fr 56px;align-items:center;gap:10px;min-height:40px}
.eqf,.eqv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.eqv{text-align:right}
.eqs{width:100%;accent-color:var(--accent);min-width:0}
.tech{align-self:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;min-height:20px;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech:empty{visibility:hidden}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div class="app" id="app">
  <header class="top gut">
    <button class="icon-btn" id="back" hidden aria-label="Înapoi"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Bibliotecă</h1>
    <button class="icon-btn" id="action" aria-label="Meniu"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <main id="main" class="gut"></main>
  <div class="mini" id="mini" hidden role="button" tabindex="0" aria-label="Deschide player-ul">
    <div class="thumb" id="miniArt"></div>
    <div class="txt"><div class="t1" id="miniT"></div><div class="t2" id="miniS"></div></div>
    <button class="ctl" id="miniPlay" aria-label="Redă sau pauză"></button>
    <button class="ctl" id="miniNext" aria-label="Următoarea"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM16 6h2.5v12H16z"/></svg></button>
    <i class="prog" id="miniProg"></i>
  </div>
  <nav class="tabs gut" id="tabs">
    <button class="tab on" data-tab="lib"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 5l5 15"/></svg>Bibliotecă</button>
    <button class="tab" data-tab="alb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Albume</button>
    <button class="tab" data-tab="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.8 16.2a6 6 0 010-8.4M16.2 7.8a6 6 0 010 8.4M4.9 19.1a10 10 0 010-14.2M19.1 4.9a10 10 0 010 14.2"/></svg>Radio</button>
    <button class="tab" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Caută</button>
  </nav>
</div>

<section class="player off gut" id="player" aria-hidden="true">
  <div class="pl-bg"><img id="plBg" alt="" hidden></div>
  <div class="pl-in">
    <div class="pl-head">
      <button class="icon-btn" id="plClose" aria-label="Închide"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pl-src" id="plSrc">Redare</div>
      <button class="icon-btn" id="plMore" aria-label="Opțiuni"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
    <div class="pl-art" id="plArt"></div>
    <div class="pl-meta">
      <div class="txt" style="flex:1"><div class="pl-t" id="plT"></div><div class="pl-s" id="plS"></div></div>
      <button class="more star" id="plFav" aria-label="Favorit"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.4-9.3-9.2C1.5 8 3.6 4.5 7.1 4.5c2 0 3.5 1.1 4.9 2.9 1.4-1.8 2.9-2.9 4.9-2.9 3.5 0 5.6 3.5 4.4 6.8-1.8 4.8-9.3 9.2-9.3 9.2z"/></svg></button>
    </div>
    <div class="local-only" id="scrubWrap">
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Poziție în piesă">
      <div class="times"><span id="tCur">0:00</span><span id="tRem">-0:00</span></div>
    </div>
    <div class="radio-only" style="justify-content:center"><span class="live">LIVE</span></div>
    <div class="tech" id="tech"></div>
    <div class="ctrls">
      <button class="cb sm local-only" id="plShuffle" aria-label="Amestecare"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="cb" id="plPrev" aria-label="Anterioara"><svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM5.5 6H8v12H5.5z"/></svg></button>
      <button class="cb big" id="plPlay" aria-label="Redă sau pauză"></button>
      <button class="cb" id="plNext" aria-label="Următoarea"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM16 6h2.5v12H16z"/></svg></button>
      <button class="cb sm local-only" id="plRepeat" aria-label="Repetare"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg><span class="badge" id="repBadge"></span></button>
    </div>
    <div class="pl-foot">
      <button id="plQueue" class="local-only"><svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9M18 14v7M21 17.5l-3 3.5-3-3.5"/></svg>Urmează</button>

function guess(f){const path=(f.webkitRelativePath||"").split("/");
  let title=f.name.replace(/\.[^.]+$/,"").replace(/_/g," ").trim(),track=0,artist="",album="";
  const m=title.match(/^(\d{1,3})[\s.\-]+(.+)$/);if(m){track=+m[1];title=m[2]}
  const p=title.split(/\s+-\s+/);if(p.length>=2){artist=p[0];title=p.slice(1).join(" - ")}
  if(path.length>=3){album=path[path.length-2];if(!artist)artist=path[path.length-3]}else if(path.length===2)album=path[0];

async function addFiles(list){
  const all=[...list].filter(f=>/^audio\//.test(f.type)||AUDIO_RE.test(f.name));
  const files=all.filter(f=>elLocal.canPlayType(f.type||mime(f.name))!=="");const bad=all.length-files.length;
  if(!files.length)return toast(bad?"Formatul acestor fișiere nu poate fi redat pe acest dispozitiv":"Niciun fișier audio în selecție");
  if(!db)return toast("Stocarea locală nu e disponibilă");
  const known=new Set(tracks.map(t=>t.key));let added=0,skipped=0;
  busy={n:0,total:files.length,name:""};render();
  for(const f of files){
    busy.n++;busy.name=f.name;updateBusy();
    const key=f.name+"|"+f.size;if(known.has(key)){skipped++;continue}
    try{
      const tags=await readTags(f),g=guess(f),type=f.type||mime(f.name);
      const id=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
      const blob=new Blob([await f.arrayBuffer()],{type});
      const pic=tags.picture&&tags.picture.data?new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format||"image/jpeg"}):null;
      const meta={id,key,type,title:String(tags.title||g.title||f.name).trim(),
        artist:String(tags.artist||g.artist||UNK_AR).trim()||UNK_AR,album:String(tags.album||g.album||UNK_AL).trim()||UNK_AL,
        genre:String(tags.genre||"Necunoscut").trim()||"Necunoscut",year:parseInt(tags.year,10)||0,
        track:parseInt(tags.track,10)||g.track||0,hasArt:!!pic,added:Date.now()};
      await op("files","readwrite",s=>s.put(blob,id));
      if(pic)await op("art","readwrite",s=>s.put(pic,id));
      await op("meta","readwrite",s=>s.put(meta));
      tracks.push(meta);known.add(key);added++;
    }catch(e){toast("Spațiu insuficient sau fișier ilizibil");break}
  }
  busy=null;sortTracks(tracks);render();
  toast(added+" piese adăugate"+(skipped?" · "+skipped+" existau deja":"")+(bad?" · "+bad+" în format nesuportat":""));
}

function jsonp(url,ms){return new Promise((res,rej)=>{const cb="__rola_"+Math.random().toString(36).slice(2);const s=document.createElement("script");
  const clean=()=>{clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
  const t=setTimeout(()=>{clean();rej(new Error("timeout"))},ms||8000);
  window[cb]=d=>{clean();res(d)};s.onerror=()=>{clean();rej(new Error("blocked"))};
  s.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+cb;document.head.appendChild(s)})}
let lookActive=0;const lookWait=[];
function throttle(fn){return new Promise((res,rej)=>{const go=()=>{lookActive++;fn().then(res,rej).finally(()=>{lookActive--;setTimeout(()=>{const n=lookWait.shift();if(n)n()},250)})};
  if(lookActive<2)go();else lookWait.push(go)})}
async function lookupOnline(t){
  const single=t.album===UNK_AL;const who=t.artist===UNK_AR?"":t.artist+" ";
  const term=encodeURIComponent((who+(single?t.title:t.album)).trim());let reached=false;
  try{const d=await jsonp("https://itunes.apple.com/search?term="+term+"&media=music&entity="+(single?"song":"album")+"&limit=5");reached=true;
    const r=(d.results||[]).find(x=>x.artworkUrl100);if(r)return r.artworkUrl100.replace(/100x100bb/,"600x600bb")}catch(e){}
  try{const d=await jsonp("https://api.deezer.com/search/"+(single?"track":"album")+"?q="+term+"&limit=5&output=jsonp");reached=true;
    const r=(d.data||[]).find(x=>single?(x.album&&x.album.cover_xl):x.cover_xl);if(r)return single?r.album.cover_xl:r.cover_xl}catch(e){}
  if(!reached)throw new Error("offline");return null}
function onlineKey(t){return(t.album===UNK_AL?"s:"+t.artist+"|"+t.title:"a:"+t.artist+"|"+t.album).toLowerCase()}
async function artFor(t){
  if(!t)return null;

  if(t.album!==UNK_AL){const sib=tracks.find(x=>x.hasArt&&x.album===t.album&&x.artist===t.artist);if(sib)return localArt(sib.id)}

  if(k in artCache)return artCache[k]||null;
  if(!settings.online)return null;
  if(pending.has(k))return pending.get(k);
  const p=throttle(()=>lookupOnline(t)).then(u=>{artCache[k]=u||"";ls("rola.artcache",artCache);return u||null},()=>null).finally(()=>pending.delete(k));
  pending.set(k,p);return p}

    im.onload=()=>{box.innerHTML="";box.appendChild(im)};im.src=u})}
const io="IntersectionObserver" in window?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const f=e.target.__art;if(f)f()}})},{root:null,rootMargin:"300px"}):null;

  if(!settings.online)return toast("Activează mai întâi căutarea online");

    if(t.album!==UNK_AL&&tracks.some(x=>x.hasArt&&x.album===t.album&&x.artist===t.artist))continue;seen.add(k);delete artCache[k];todo.push(t)}

  await Promise.all(todo.map(t=>artFor(t).then(u=>{if(u)found++})));

const shuf=l=>{const a=l.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  if(shuffle){queue=[cur].concat(shuf(src.filter(t=>t.id!==cur.id)));qi=0}else{queue=src.slice();qi=Math.max(0,queue.findIndex(t=>t.id===cur.id))}}

  if(auto){try{await audio.play()}catch(e){toast("Apasă ▶ pentru redare")}}
  saveLast();updateMedia();syncAll()}

  if(mode==="radio"&&station){if(audio.paused){if(!audio.src||audio.src===SILENT||audio.error){audio.src=station.url}audio.play().catch(()=>toast("Postul nu răspunde"))}else audio.pause();return}

function next(auto){
  if(mode==="radio"){if(!radioList.length)return;const i=(radioList.findIndex(s=>s.id===station.id)+1)%radioList.length;return playStation(radioList,i)}
  if(!queue.length)return;if(qi<queue.length-1)qi++;else if(repeat==="all"||!auto)qi=0;else{audio.pause();syncAll();return}

function prev(){
  if(mode==="radio"){if(!radioList.length)return;const n=radioList.length;const i=(radioList.findIndex(s=>s.id===station.id)-1+n)%n;return playStation(radioList,i)}

function toggleFav(t){if(favs.has(t.id)){favs.delete(t.id);toast("Scoasă din Favorite")}else{favs.add(t.id);toast("Adăugată la Favorite")}ls("rola.favs",[...favs]);syncPlayer();render()}

  if(v==="end")sleepEnd=true;else if(v){sleepAt=Date.now()+v*60000;sleepTimer=setTimeout(()=>{audio.pause();sleepAt=0;syncAll();toast("Timer de somn: pauză")},v*60000)}syncAll()}

  if(mode!=="local"||!cur||loadedId!==cur.id)return;const d=audio.duration,c=audio.currentTime;

  if(mode==="radio"){audio.src=station.url;audio.play().catch(()=>{});return}

async function updateMedia(){if(!("mediaSession" in navigator))return;
  try{if(mode==="radio"&&station){navigator.mediaSession.metadata=new MediaMetadata({title:station.name,artist:station.tags||"Radio",album:"Radio live",artwork:station.favicon?[{src:station.favicon,sizes:"256x256"}]:[]})}
  else if(cur){const t=cur;const u=await artFor(t);if(cur!==t)return;navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:u?[{src:u,sizes:"600x600"}]:[]})}}catch(e){}}

  sh("play",()=>{if(audio.paused)toggle()});sh("pause",()=>audio.pause());sh("previoustrack",prev);sh("nexttrack",()=>next(false));
  sh("seekto",d=>{if(mode==="local"&&d&&isFinite(d.seekTime))audio.currentTime=d.seekTime})}

/* ---------------- mini & full player ---------------- */
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let miniFor=null,plFor=null,scrubbing=false;

function syncMini(){const has=(mode==="local"&&cur)||(mode==="radio"&&station);$("#mini").hidden=!has;if(!has)return;
  $("#miniPlay").innerHTML=audio.paused?I.play:I.pause;

      if(station.favicon){const im=new Image();im.alt="";im.referrerPolicy="no-referrer";im.onload=()=>{th.innerHTML="";th.appendChild(im)};im.src=station.favicon}}

function progress(){const d=audio.duration,c=audio.currentTime,p=mode==="local"&&d?c/d*100:0;
  $("#miniProg").style.width=p+"%";
  if(!playerOpen()||mode!=="local"||scrubbing)return;const s=$("#scrub");s.value=d?Math.round(c/d*1000):0;s.style.setProperty("--p",p+"%");
  $("#tCur").textContent=fmt(c);$("#tRem").textContent="-"+fmt((d||0)-c)}
$("#mini").addEventListener("click",e=>{if(e.target.closest(".ctl"))return;openPlayer()});

const playerOpen=()=>!$("#player").classList.contains("off");
function openPlayer(){const p=$("#player");p.classList.remove("off");p.setAttribute("aria-hidden","false");plFor=null;syncPlayer()}
function closePlayer(){const p=$("#player");p.classList.add("off");p.setAttribute("aria-hidden","true")}
function tint(url){return new Promise(res=>{const im=new Image();if(!/^blob:|^data:/.test(url))im.crossOrigin="anonymous";
  im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=16;const x=c.getContext("2d");x.drawImage(im,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);const w=1+(mx-mn)/40;r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;n+=w}
    res("rgb("+Math.round(r/n*.55)+","+Math.round(g/n*.55)+","+Math.round(b/n*.55)+")")}catch(e){res(null)}};im.onerror=()=>res(null);im.src=url})}
function syncPlayer(){if(!playerOpen())return;const P=$("#player");
  P.classList.toggle("radio",mode==="radio");P.classList.toggle("paused",audio.paused);
  $("#plPlay").innerHTML=audio.paused?I.play:I.pause;

  const key=mode==="radio"&&station?"r:"+station.id:cur?"t:"+cur.id:null;if(!key||plFor===key){progress();return}plFor=key;
  const art=$("#plArt"),bg=$("#plBg");bg.hidden=true;P.style.removeProperty("--tint");
  const setImg=u=>{if(plFor!==key||!u)return;const im=new Image();im.alt="";im.referrerPolicy="no-referrer";im.onload=()=>{if(plFor!==key)return;art.innerHTML="";art.appendChild(im);bg.src=u;bg.hidden=false;tint(u).then(c=>{if(c&&plFor===key)P.style.setProperty("--tint",c)})};im.src=u};
  if(mode==="radio"){$("#plT").textContent=station.name;$("#plS").textContent=[station.tags,station.bitrate?station.bitrate+" kbps":""].filter(Boolean).join(" · ")||"Radio online";
    $("#plSrc").textContent="Radio live";art.innerHTML=I.radio;if(station.favicon)setImg(station.favicon)}
  else{$("#plT").textContent=cur.title;$("#plS").textContent=cur.artist+" — "+cur.album;$("#plSrc").textContent=cur.album;art.innerHTML=I.note;artFor(cur).then(setImg)}
  progress()}

  P.addEventListener("touchend",e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(dy>90)closePlayer()},{passive:true})})();

/* ---------------- audio quality, output, EQ ---------------- */
const rqLabel=()=>radioMinKbps?radioMinKbps+" kbps+":"Orice";
function findBytes(b,s){const c=[...s].map(x=>x.charCodeAt(0));outer:for(let i=0;i<b.length-c.length;i++){for(let k=0;k<c.length;k++)if(b[i+k]!==c[k])continue outer;return i}return -1}
async function parseTech(blob,t){
  const ext=((t.key||"").split("|")[0].split(".").pop()||"").toLowerCase();
  const r={codec:({mp3:"MP3",flac:"FLAC",wav:"WAV",aif:"AIFF",aiff:"AIFF",m4a:"AAC",m4b:"AAC",mp4:"AAC",alac:"ALAC",aac:"AAC",ogg:"OGG",oga:"OGG",opus:"Opus",caf:"CAF"})[ext]||ext.toUpperCase(),sr:0,bits:0,ch:0};
  try{const b=new Uint8Array(await blob.slice(0,262144).arrayBuffer());const str=(o,n)=>String.fromCharCode.apply(null,b.slice(o,o+n));
    if(str(0,4)==="fLaC"){r.codec="FLAC";r.sr=(b[18]<<12)|(b[19]<<4)|(b[20]>>4);r.ch=((b[20]>>1)&7)+1;r.bits=(((b[20]&1)<<4)|(b[21]>>4))+1}
    else if(str(0,4)==="RIFF"&&str(8,4)==="WAVE"){let o=12;while(o<b.length-24){const id=str(o,4),sz=(b[o+4]|(b[o+5]<<8)|(b[o+6]<<16)|(b[o+7]<<24))>>>0;
      if(id==="fmt "){r.codec="WAV";r.ch=b[o+10]|(b[o+11]<<8);r.sr=(b[o+12]|(b[o+13]<<8)|(b[o+14]<<16)|(b[o+15]<<24))>>>0;r.bits=b[o+22]|(b[o+23]<<8);break}o+=8+sz+(sz&1)}}
    else if(str(0,3)==="ID3"||(b[0]===0xFF&&(b[1]&0xE0)===0xE0)){r.codec="MP3";let o=0;if(str(0,3)==="ID3")o=10+((b[6]&127)<<21|(b[7]&127)<<14|(b[8]&127)<<7|(b[9]&127));
      for(;o<b.length-4;o++){if(b[o]===0xFF&&(b[o+1]&0xE0)===0xE0){const ver=(b[o+1]>>3)&3,sri=(b[o+2]>>2)&3,base=[44100,48000,32000][sri];if(base&&ver!==1){r.sr=ver===3?base:ver===2?base/2:base/4;r.ch=(b[o+3]>>6)===3?1:2;break}}}}
    else{let j=findBytes(b,"alac");if(j>=0)r.codec="ALAC";else{j=findBytes(b,"mp4a");if(j>=0)r.codec="AAC"}
      if(j>=0&&j+30<b.length){r.ch=(b[j+20]<<8)|b[j+21];const bits=(b[j+22]<<8)|b[j+23];r.sr=(b[j+28]<<8)|b[j+29];if(r.codec==="ALAC")r.bits=bits;
        if(r.codec==="ALAC"){const k=findBytes(b.subarray(j+8),"alac");if(k>=0){const o=j+8+k+4+4;if(o+24<b.length){r.bits=b[o+5]||r.bits;const sr2=((b[o+20]<<24)|(b[o+21]<<16)|(b[o+22]<<8)|b[o+23])>>>0;if(sr2>7999&&sr2<800000)r.sr=sr2}}}}}
  }catch(e){}
  if(!(r.sr>7999&&r.sr<800000))r.sr=0;if(!(r.bits>0&&r.bits<=32))r.bits=0;return r}
function setTech(){const el=$("#tech");if(!el)return;
  if(mode==="radio"&&station){el.textContent=[station.codec||"",station.bitrate?station.bitrate+" kbps":""].filter(Boolean).join(" · ");return}
  if(mode!=="local"||!cur){el.textContent="";return}
  const t=curTech,d=audio.duration;const kb=d&&curSize?Math.round(curSize*8/d/1000):0;
  if(!t){el.textContent=kb?kb+" kbps":"";return}
  const lossless=/FLAC|ALAC|WAV|AIFF/.test(t.codec);const hires=lossless&&(t.bits>16||t.sr>48000);
  const khz=t.sr?(t.sr/1000).toFixed(1).replace(/\.0$/,"")+" kHz":"";
  el.textContent=[t.codec,hires?"Hi-Res":lossless?"Lossless":"",t.bits&&khz?t.bits+"-bit/"+khz:khz,kb?kb+" kbps":""].filter(Boolean).join(" · ")}
function pickOutput(){const a=audio;if(a&&typeof a.webkitShowPlaybackTargetPicker==="function"){try{a.webkitShowPlaybackTargetPicker();return}catch(e){}}
  toast("Alege ieșirea din Control Center, butonul AirPlay")}
function ensureGraph(){if(actx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{actx=new AC();const src=actx.createMediaElementSource(elLocal);preNode=actx.createGain();src.connect(preNode);let node=preNode;
    eqNodes=EQ_F.map((f,i)=>{const b=actx.createBiquadFilter();b.type=i===0?"lowshelf":i===EQ_F.length-1?"highshelf":"peaking";b.frequency.value=f;b.Q.value=1.1;b.gain.value=0;node.connect(b);node=b;return b});
    node.connect(actx.destination);return true}catch(e){actx=null;return false}}
function applyEq(){if(!eq.on&&!actx)return;
  if(eq.on&&!ensureGraph()){eq.on=false;saveEq();return toast("Egalizatorul nu e suportat în acest browser")}
  eqNodes.forEach((b,i)=>{b.gain.value=eq.on?eq.gains[i]:0});
  const mx=Math.max(0,...eq.gains);preNode.gain.value=eq.on?Math.pow(10,-mx/20):1;wake()}
const saveEq=()=>ls("rola.eq",eq);
const fmtDb=v=>(v>0?"+":"")+(+v).toFixed(1).replace(/\.0$/,"")+" dB";
function eqSheet(){openSheet(p=>{
  const hd=h("div","s-head");const x=h("div","txt");x.appendChild(h("div","t1","Egalizator · "+(eq.on?eq.preset:"oprit")));x.appendChild(h("div","t2","Se aplică muzicii tale. Radioul rămâne neprocesat."));hd.appendChild(x);p.appendChild(hd);
  let wrap;
  sItem(p,I.eq,"Egalizator",b=>{eq.on=!eq.on;saveEq();applyEq();b.querySelector(".val").textContent=eq.on?"Pornit":"Oprit";wrap.style.opacity=eq.on?1:.45;syncPlayer()},eq.on?"Pornit":"Oprit");
  wrap=h("div","eqwrap");wrap.style.opacity=eq.on?1:.45;
  const ch=h("div","chips");Object.keys(EQ_P).forEach(n=>{const c=h("button","chip"+(eq.on&&eq.preset===n?" on":""),n);
    c.addEventListener("click",()=>{unlock();eq.preset=n;eq.gains=EQ_P[n].slice();eq.on=true;saveEq();applyEq();syncPlayer();eqSheet()});ch.appendChild(c)});wrap.appendChild(ch);
  EQ_F.forEach((f,i)=>{const r=h("label","eqrow");r.appendChild(h("span","eqf",f>=1000?(f/1000)+"k":String(f)));
    const sl=h("input","eqs");sl.type="range";sl.min="-12";sl.max="12";sl.step="0.5";sl.value=String(eq.gains[i]);sl.setAttribute("aria-label",f+" Hz");
    const v=h("span","eqv",fmtDb(eq.gains[i]));
    sl.addEventListener("input",()=>{unlock();eq.gains[i]=+sl.value;eq.preset="Personalizat";eq.on=true;v.textContent=fmtDb(+sl.value);wrap.style.opacity=1;applyEq()});
    sl.addEventListener("change",()=>{saveEq();syncPlayer()});r.append(sl,v);wrap.appendChild(r)});
  p.appendChild(wrap);
  const n=h("p","note","Dacă pe iPhone-ul tău sunetul se oprește cu ecranul blocat cât timp egalizatorul e pornit, oprește-l; redarea normală nu are această limită.");n.style.padding="0 18px";p.appendChild(n)})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});

/* ---------------- misc ---------------- */
let toastT=0;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2400)}
function makeIcon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#F0619D");g.addColorStop(1,"#7A1E52");x.fillStyle=g;x.fillRect(0,0,180,180);
  x.strokeStyle="rgba(255,255,255,.95)";x.lineWidth=10;x.lineCap="round";[30,48,66].forEach(r=>{x.beginPath();x.arc(90,90,r,-.9,.9);x.stroke();x.beginPath();x.arc(90,90,r,Math.PI-.9,Math.PI+.9);x.stroke()});
  x.fillStyle="#fff";x.beginPath();x.arc(90,90,12,0,7);x.fill();
  const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}}

(async function boot(){
  const m=ls("rola.modes");if(m){shuffle=!!m.shuffle;repeat=m.repeat||"off"}
  const f=ls("rola.favs");if(Array.isArray(f))favs=new Set(f);
  const p=ls("rola.plays");if(p&&typeof p==="object")plays=p;
  const rf=ls("rola.radiofavs");if(Array.isArray(rf))radioFavs=rf;
  const ac=ls("rola.artcache");if(ac&&typeof ac==="object")artCache=ac;
  const eqs=ls("rola.eq");if(eqs&&Array.isArray(eqs.gains)&&eqs.gains.length===10)eq=eqs;
  const rq=ls("rola.radioq");if(typeof rq==="number")radioMinKbps=rq;
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  if(eq.on)applyEq();
  const st=ls("rola.settings");if(st&&typeof st==="object")settings=Object.assign(settings,st);
  makeIcon();render();
  try{db=await idbOpen();const all=await op("meta","readonly",s=>s.getAll());tracks=sortTracks(all||[]);
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
  catch(e){toast("Stocarea locală e blocată în acest browser")}
  const last=ls("rola.last");
  if(last&&last.station){useEl(elRadio);mode="radio";station=last.station;radioList=radioFavs.length?radioFavs.slice():[station]}
  else if(last&&last.id){const i=tracks.findIndex(t=>t.id===last.id);if(i>=0){mode="local";baseList=tracks.slice();queue=baseList.slice();qi=i;cur=tracks[i];resume={id:cur.id,t:+last.t||0};updateMedia()}}
  render();
})();
})();
