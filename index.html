<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Onest:wght@400;500;600&family=VT323&family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: phone-first app shell. Header, scrolling content, floating mini player, 4-tab bar; full-screen player sheet tinted by the cover. */
:root{
  --bg:#F5F4F7;--surface:#FFFFFF;--surface2:#EBE9EF;--fg:#16141B;--muted:#6A6674;--line:#E1DDE7;
  --accent:#C2366E;--on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(22,10,30,.06),0 8px 22px rgba(22,10,30,.08);
  --f-display:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D11;--surface:#18161D;--surface2:#24212A;--fg:#F3F1F6;--muted:#9C97A6;--line:#2C2834;
  --accent:#F0619D;--on-accent:#17060E;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D11;--surface:#18161D;--surface2:#24212A;--fg:#F3F1F6;--muted:#9C97A6;--line:#2C2834;
  --accent:#F0619D;--on-accent:#17060E;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}
[hidden]{display:none!important}
img{max-width:100%}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 8px;flex:none}
.top h1{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;flex:none;cursor:pointer}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;overscroll-behavior:contain}
.h2{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.h2:first-child{margin-top:6px}
.h2 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.rows{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 12px;min-height:58px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.thumb{width:44px;height:44px;border-radius:9px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-weight:600}
.thumb img,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.txt{flex:1;min-width:0}
.t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);margin-top:1px}
.num{width:22px;text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.cnt{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.chev{color:var(--muted);flex:none;padding-right:6px}
.row.playing .t1{color:var(--accent)}
.more{width:38px;height:38px;border:0;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.more svg{width:20px;height:20px;fill:currentColor}
.star{color:var(--muted)}.star.on{color:var(--accent)}
.star svg{fill:none;stroke:currentColor;stroke-width:2}.star.on svg{fill:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:18px 14px}

@keyframes pulse{50%{opacity:.3}}
.banner{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}

.mini{margin:0 8px 6px;flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);flex:none}
.tab{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}

.player{position:fixed;inset:0;z-index:20;isolation:isolate;color:#fff;background:#0D0C10;display:flex;flex-direction:column;

.pl-in{max-width:520px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}

.pl-src{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.75;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.pl-art{width:min(100%,46vh,400px);aspect-ratio:1;max-width:100%;margin:auto;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 30px 60px rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .3s}
.pl-art img{width:100%;height:100%;object-fit:cover}
.pl-art svg{width:30%;height:30%;fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.5}
.player.paused .pl-art{transform:scale(.9)}
.pl-meta{display:flex;align-items:center;gap:12px}
.pl-meta .txt{min-width:0}
.pl-t{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-s{color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pl-meta .more,.pl-meta .star{color:rgba(255,255,255,.8)}
.pl-meta .star.on{color:#fff}
.scrub{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:24px;margin:0;cursor:pointer}
.scrub::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px;border:0}
.scrub::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.scrub::-moz-range-progress{height:5px;border-radius:3px;background:#fff}
.scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;margin-top:-4px}
.ctrls{display:grid;grid-template-columns:1fr 1.2fr 1.5fr 1.2fr 1fr;align-items:center;justify-items:center}
.cb{border:0;background:none;color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.cb svg{width:30px;height:30px;fill:currentColor}
.cb.sm svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb.sm{opacity:.55;position:relative}
.cb.sm.on{opacity:1}
.cb.sm .badge{position:absolute;bottom:8px;right:8px;font-size:9px;font-weight:700}
.cb.big{width:74px;height:74px;background:#fff;color:#111}
.cb.big svg{width:32px;height:32px}
.pl-foot{display:flex;justify-content:space-around}
.pl-foot button{border:0;background:none;color:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;cursor:pointer;padding:6px 10px}
.pl-foot svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pl-foot .on{color:#fff}
.radio-only{display:none}.player.radio .radio-only{display:flex}.player.radio .local-only{visibility:hidden}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,6,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-p{width:100%;max-width:560px;max-height:78%;overflow-y:auto;background:var(--surface);color:var(--fg);border-radius:22px 22px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 14px)}
.sheet-p::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}

.s-head .t1{font-weight:600}
.s-item{display:flex;align-items:center;gap:14px;width:100%;padding:0 18px;min-height:52px;border:0;background:none;text-align:left;font-size:16px;cursor:pointer;border-bottom:1px solid var(--line)}
.s-item:last-child{border-bottom:0}

.s-item .grow{flex:1;min-width:0}
.s-item .val{color:var(--muted);font-size:14px}
.s-item.danger{color:#D7263D}.s-item.danger svg{color:#D7263D}
.eqwrap{padding:4px 18px 0;transition:opacity .2s}
.eqwrap .chips{margin:6px 0 10px}
.eqrow{display:grid;grid-template-columns:38px 1fr 56px;align-items:center;gap:10px;min-height:40px}

.eqv{text-align:right}
.eqs{width:100%;accent-color:var(--accent);min-width:0}
.tech{align-self:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;min-height:20px;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech:empty{visibility:hidden}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* Retro theme: handheld with LCD, thumb-roller and five keys (Rola's own design) */
.retro{position:fixed;inset:0;z-index:15;display:flex;justify-content:center;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;font-family:"Chakra Petch",system-ui,sans-serif;
  --lcd:#1a1106;--ink:#ffb347;--dim:#a0702e;--glow:rgba(255,160,60,.35);--hot:#ff8a1f;--hot-ink:#1a1106;
  --body:#2a2e33;--body-hi:#3b4048;--edge:#0a0b0d;--key:#1c1f23;--key-ink:#c7ccd4;--label:#858c96;--ground:#101215;
  background:radial-gradient(120% 80% at 50% 0%,#1b1e23,var(--ground));color:var(--key-ink)}
.retro[data-lcd="green"]{--lcd:#08170b;--ink:#7dff8a;--dim:#3f9a4a;--glow:rgba(110,255,130,.3);--hot:#4fd65e;--hot-ink:#06200b}
.retro[data-lcd="blue"]{--lcd:#06111d;--ink:#80ccff;--dim:#3d6f99;--glow:rgba(120,200,255,.3);--hot:#3f9cf0;--hot-ink:#04121f}
.retro[data-lcd="paper"]{--lcd:#c4c9ae;--ink:#1d2316;--dim:#5d664f;--glow:transparent;--hot:#e8742a;--hot-ink:#1d1006;
  --body:#d6d6d0;--body-hi:#ededE7;--edge:#8f9095;--key:#c8c8c1;--key-ink:#2a2c2f;--label:#6c6f73;--ground:#cfcdc6;
  background:radial-gradient(120% 80% at 50% 0%,#ecebe6,var(--ground))}
.retro .device{width:100%;max-width:400px;height:100%;max-height:800px;display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:30px;
  background:linear-gradient(160deg,var(--body-hi),var(--body) 40%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.3),0 24px 48px rgba(0,0,0,.45)}
.retro .brand{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--label);padding:0 4px}
.retro .brand b{color:var(--hot);letter-spacing:.28em}
.retro .screen{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--lcd);border:3px solid var(--edge);border-radius:12px;
  box-shadow:inset 0 0 28px rgba(0,0,0,.55);font-family:"VT323",ui-monospace,Menlo,monospace;color:var(--ink);text-shadow:0 0 6px var(--glow)}
.retro .screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px)}
.rbar{display:flex;justify-content:space-between;gap:10px;padding:4px 10px 3px;font-size:21px;border-bottom:1px solid var(--dim);flex:none}
.rbar #rTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-transform:uppercase;letter-spacing:.04em}
.rview{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:1px 10px;font-size:27px;line-height:1.18;white-space:nowrap;cursor:pointer}
.rrow .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .r{color:var(--dim);flex:none;font-size:22px}
.rrow.sel{background:var(--ink);color:var(--lcd);text-shadow:none}.rrow.sel .r{color:var(--lcd)}
.rnote{padding:8px 12px;font-size:21px;line-height:1.2;color:var(--dim)}
.rletter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:96px;height:96px;display:grid;place-items:center;font-size:84px;line-height:1;background:var(--ink);color:var(--lcd);text-shadow:none;border:3px solid var(--edge);z-index:2}
.rtoast{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;padding:3px 8px;font-size:21px;line-height:1.15;text-align:center;background:var(--ink);color:var(--lcd);text-shadow:none}
.rnp{display:flex;flex-direction:column;gap:7px;padding:10px 12px 12px;height:100%}
.rnp-top{display:flex;gap:12px;align-items:center;flex:1 1 auto;min-height:0}
.rart{width:44%;max-width:170px;aspect-ratio:1;max-height:100%;flex:none;display:grid;place-items:center;overflow:hidden;border:2px solid var(--dim);font-size:56px;color:var(--dim)}
.rart img{width:100%;height:100%;object-fit:cover;filter:grayscale(.3) sepia(.25) contrast(1.05)}
.retro[data-lcd="paper"] .rart img{filter:grayscale(1) contrast(1.2)}
.rmeta{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:23px;line-height:1.08}
.rmeta .t{font-size:29px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rmeta .a,.rmeta .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rmeta .d{color:var(--dim)}
.rst{display:flex;justify-content:space-between;gap:8px;font-size:20px;color:var(--dim)}
.rprog{height:12px;border:2px solid var(--ink);position:relative;cursor:pointer}.rprog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.rtimes{display:flex;justify-content:space-between;font-size:22px;font-variant-numeric:tabular-nums}
.rtech{font-size:19px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
.retro .rollwrap{display:flex;flex-direction:column;gap:6px;flex:none}
.retro .roller{--rx:0px;height:58px;border-radius:14px;border:2px solid var(--edge);touch-action:none;cursor:grab;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(255,255,255,.08) 46%,rgba(0,0,0,.6)),repeating-linear-gradient(90deg,var(--body-hi) 0 4px,var(--edge) 4px 8px);
  background-position:0 0,var(--rx) 0;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.retro .roll-label{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--label);padding:0 4px}
.retro .keys{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1fr 1.1fr;gap:8px;flex:none}
.retro .key{height:60px;border-radius:14px;border:1px solid var(--edge);display:grid;place-items:center;background:linear-gradient(180deg,var(--body-hi),var(--key));color:var(--key-ink);
  font:700 12px/1 "Chakra Petch",system-ui,sans-serif;letter-spacing:.12em;box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer}
.retro .key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.retro .key svg{width:22px;height:22px;fill:currentColor}
.retro .key.ok{background:var(--hot);color:var(--hot-ink)}
@media (max-height:640px){.retro .key{height:50px}.retro .roller{height:48px}.retro .device{gap:10px;padding:12px}}

.retro[data-lcd="quartz"]{--lcd:#b6bea3;--ink:#141911;--dim:#56604b;--glow:transparent;--hot:#c8322b;--hot-ink:#ffffff;
  --body:#1b1b1b;--body-hi:#2e2e2e;--edge:#000000;--key:#8f9297;--key-ink:#151515;--label:#c9a24a;--ground:#0d0d0d;background:#1b1b1b!important}
.retro[data-lcd="quartz"] .device{background:linear-gradient(170deg,#2e2e2e,#171717 45%,#101010)!important}

.retro[data-lcd="quartz"] .screen{background:linear-gradient(180deg,#c0c8ad,#aab295);border:8px solid #0b0b0b;border-radius:10px;
  box-shadow:0 0 0 2px #3c3c3c,inset 0 2px 6px rgba(0,0,0,.35);font-family:"Share Tech Mono",ui-monospace,monospace;text-shadow:1px 1px 0 rgba(0,0,0,.13)}
.retro[data-lcd="quartz"] .screen::after{background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%)}
.retro[data-lcd="quartz"] .rbar{font-size:16px;letter-spacing:.08em;border-bottom:2px solid var(--ink)}
.retro[data-lcd="quartz"] .rrow{font-size:19px;line-height:1.2;padding:5px 10px}
.retro[data-lcd="quartz"] .rq{font-size:16px}
.retro[data-lcd="quartz"] .rmeta .t{font-size:19px;line-height:1.1}
.retro[data-lcd="quartz"] .rmeta .a,.retro[data-lcd="quartz"] .rmeta .d{font-size:15px;line-height:1.15}
.retro[data-lcd="quartz"] .rcount{font-size:15px;letter-spacing:.06em}
.retro[data-lcd="quartz"] .rtech{font-size:13px}
.retro[data-lcd="quartz"] .rtimes{font-family:"Seg7",ui-monospace,monospace;font-size:22px;letter-spacing:.04em}
.retro[data-lcd="quartz"] .rprog{border:2px solid var(--ink);height:10px}
.retro[data-lcd="quartz"] .rart img{filter:grayscale(1) contrast(1.25) brightness(1.05);mix-blend-mode:multiply}
.retro[data-lcd="quartz"] .rart{border:2px solid var(--ink)}
.retro[data-lcd="quartz"] .rletter{font-family:"Seg7",monospace;font-size:52px;border-radius:6px}
.retro[data-lcd="quartz"] .roller{height:46px;border-radius:8px;border:2px solid #000;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#e4e6e8 0 3px,#6a6e73 3px 6px);background-position:0 0,var(--rx) 0}
.retro[data-lcd="quartz"] .key{border-radius:6px;height:48px;border:1px solid #000;background:linear-gradient(180deg,#e2e4e7,#9a9ea3 60%,#7c8085);color:#151515;

/* E-Ink: pure black on white, no motion, no gradients, no shadows; fewer screen updates for paper displays */
.retro[data-skin="eink"]{--lcd:#ffffff;--ink:#000000;--dim:#000000;--glow:transparent;--hot:#000000;--hot-ink:#ffffff;--body:#ffffff;--body-hi:#ffffff;
  --edge:#000000;--key:#ffffff;--key-ink:#000000;--label:#000000;--ground:#ffffff;background:#ffffff!important;color:#000;font-family:var(--f-body)}
.retro[data-skin="eink"] *,.retro[data-skin="eink"] *::before,.retro[data-skin="eink"] *::after{transition:none!important;animation:none!important;text-shadow:none!important;box-shadow:none!important}
.retro[data-skin="eink"] .device{background:#ffffff!important}
.retro[data-skin="eink"] .brand{color:#000;font-family:var(--f-body)}
.retro[data-skin="eink"] .screen{background:#fff;border:2px solid #000;border-radius:10px;font-family:var(--f-body);color:#000}
.retro[data-skin="eink"] .screen::after{display:none}
.retro[data-skin="eink"] .rbar{border-bottom:2px solid #000;font-size:15px;font-weight:700;letter-spacing:.08em;padding:8px 12px}
.retro[data-skin="eink"] .rrow{font-size:20px;font-weight:600;line-height:1.25;padding:9px 12px;border-bottom:1px solid #000}
.retro[data-skin="eink"] .rrow:last-child{border-bottom:0}
.retro[data-skin="eink"] .rrow .r{color:#000;font-size:16px}
.retro[data-skin="eink"] .rrow.sel{background:#000;color:#fff}
.retro[data-skin="eink"] .rrow.sel .r{color:#fff}
.retro[data-skin="eink"] .rq{font-size:17px}
.retro[data-skin="eink"] .rq.now .l{text-decoration:none;font-weight:800}
.retro[data-skin="eink"] .rart{border:2px solid #000;color:#000}
.retro[data-skin="eink"] .rart img{filter:grayscale(1) contrast(1.2)}
.retro[data-skin="eink"] .rmeta .t{font-size:20px;font-weight:800;line-height:1.15}
.retro[data-skin="eink"] .rmeta .a,.retro[data-skin="eink"] .rmeta .d{font-size:16px;font-weight:600;color:#000;line-height:1.2}
.retro[data-skin="eink"] .rcount,.retro[data-skin="eink"] .rtimes{font-size:16px;font-weight:700}

.retro[data-skin="eink"] .rprog{height:12px;border:2px solid #000;background:#fff}

.retro[data-skin="eink"] .ric.on{background:#000;color:#fff}
.retro[data-skin="eink"] .roller{height:52px;border-radius:26px;border:2px solid #000;background:#fff;

.retro[data-skin="eink"] .key{height:54px;border-radius:12px;border:2px solid #000;background:#fff;color:#000;font-family:var(--f-body);font-weight:700}

async function addFiles(list){
  const all=[...list].filter(f=>/^audio\//.test(f.type)||AUDIO_RE.test(f.name));
  const files=all.filter(f=>elLocal.canPlayType(f.type||mime(f.name))!=="");const bad=all.length-files.length;
  if(!files.length)return toast(bad?T("Formatul acestor fișiere nu poate fi redat pe acest dispozitiv"):T("Niciun fișier audio în selecție"));
  if(!db)return toast(T("Stocarea locală nu e disponibilă"));
  const known=new Set(tracks.map(t=>t.key));let added=0,skipped=0;
  busy={n:0,total:files.length,name:""};render();
  for(const f of files){
    busy.n++;busy.name=f.name;updateBusy();
    const key=f.name+"|"+f.size;if(known.has(key)){skipped++;continue}
    try{
      const tags=await readTags(f),g=guess(f),type=f.type||mime(f.name);
      const id=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
      const blob=new Blob([await f.arrayBuffer()],{type});
      const pic=tags.picture&&tags.picture.data?new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format||"image/jpeg"}):null;
      const meta={id,key,type,title:String(tags.title||g.title||f.name).trim(),
        artist:String(tags.artist||g.artist||UNK_AR).trim()||UNK_AR,album:String(tags.album||g.album||UNK_AL).trim()||UNK_AL,
        genre:String(tags.genre||"Necunoscut").trim()||"Necunoscut",year:parseInt(tags.year,10)||0,
        track:parseInt(tags.track,10)||g.track||0,hasArt:!!pic,added:Date.now()};
      await op("files","readwrite",s=>s.put(blob,id));
      if(pic)await op("art","readwrite",s=>s.put(pic,id));
      await op("meta","readwrite",s=>s.put(meta));
      tracks.push(meta);known.add(key);added++;
    }catch(e){toast(T("Spațiu insuficient sau fișier ilizibil"));break}
  }
  busy=null;sortTracks(tracks);render();rRefresh();
  toast(added+T(" piese adăugate")+(skipped?" · "+skipped+T(" existau deja"):"")+(bad?" · "+bad+T(" în format nesuportat"):""));
}

async function fetchMissingArt(){

  for(const t of tracks){if(t.hasArt)continue;const k=onlineKey(t);if(seen.has(k)||(k in artCache&&artCache[k]))continue;
    if(t.album!==UNK_AL&&tracks.some(x=>x.hasArt&&x.album===t.album&&x.artist===t.artist))continue;seen.add(k);delete artCache[k];todo.push(t)}
  if(!todo.length)return toast(T("Toate albumele au coperți"));

function wake(){if(actx&&actx.state!=="running")actx.resume().catch(()=>{})}
const shuf=l=>{const a=l.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function playList(list,i){mode="local";station=null;baseList=list.slice();
  if(shuffle){const f=list[i];queue=[f].concat(shuf(list.filter(t=>t!==f)));qi=0}else{queue=baseList.slice();qi=i}
  loadAndPlay(true)}
function rebuildQueue(){if(mode!=="local"||!cur)return;const src=baseList.length?baseList:tracks;
  if(shuffle){queue=[cur].concat(shuf(src.filter(t=>t.id!==cur.id)));qi=0}else{queue=src.slice();qi=Math.max(0,queue.findIndex(t=>t.id===cur.id))}}
async function loadAndPlay(auto){const t=queue[qi];if(!t)return;mode="local";cur=t;station=null;syncAll();
  let blob=null;try{blob=await getFile(t.id)}catch(e){}
  if(cur!==t)return;if(!blob)return toast(T("Fișierul lipsește din bibliotecă"));
  useEl(elLocal);wake();if(curURL)URL.revokeObjectURL(curURL);curURL=URL.createObjectURL(blob);audio.src=curURL;loadedId=t.id;counted=null;curSize=blob.size;curTech=null;setTech();parseTech(blob,t).then(r=>{if(cur===t){curTech=r;setTech()}});

function tint(url){return new Promise(res=>{const im=new Image();if(!/^blob:|^data:/.test(url))im.crossOrigin="anonymous";
  im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=16;const x=c.getContext("2d");x.drawImage(im,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);const w=1+(mx-mn)/40;r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;n+=w}

const rqLabel=()=>radioMinKbps?radioMinKbps+" kbps+":T("Orice");
function findBytes(b,s){const c=[...s].map(x=>x.charCodeAt(0));outer:for(let i=0;i<b.length-c.length;i++){for(let k=0;k<c.length;k++)if(b[i+k]!==c[k])continue outer;return i}return -1}
async function parseTech(blob,t){
  const ext=((t.key||"").split("|")[0].split(".").pop()||"").toLowerCase();
  const r={codec:({mp3:"MP3",flac:"FLAC",wav:"WAV",aif:"AIFF",aiff:"AIFF",m4a:"AAC",m4b:"AAC",mp4:"AAC",alac:"ALAC",aac:"AAC",ogg:"OGG",oga:"OGG",opus:"Opus",caf:"CAF"})[ext]||ext.toUpperCase(),sr:0,bits:0,ch:0};
  try{const b=new Uint8Array(await blob.slice(0,262144).arrayBuffer());const str=(o,n)=>String.fromCharCode.apply(null,b.slice(o,o+n));
    if(str(0,4)==="fLaC"){r.codec="FLAC";r.sr=(b[18]<<12)|(b[19]<<4)|(b[20]>>4);r.ch=((b[20]>>1)&7)+1;r.bits=(((b[20]&1)<<4)|(b[21]>>4))+1}
    else if(str(0,4)==="RIFF"&&str(8,4)==="WAVE"){let o=12;while(o<b.length-24){const id=str(o,4),sz=(b[o+4]|(b[o+5]<<8)|(b[o+6]<<16)|(b[o+7]<<24))>>>0;
      if(id==="fmt "){r.codec="WAV";r.ch=b[o+10]|(b[o+11]<<8);r.sr=(b[o+12]|(b[o+13]<<8)|(b[o+14]<<16)|(b[o+15]<<24))>>>0;r.bits=b[o+22]|(b[o+23]<<8);break}o+=8+sz+(sz&1)}}
    else if(str(0,3)==="ID3"||(b[0]===0xFF&&(b[1]&0xE0)===0xE0)){r.codec="MP3";let o=0;if(str(0,3)==="ID3")o=10+((b[6]&127)<<21|(b[7]&127)<<14|(b[8]&127)<<7|(b[9]&127));
      for(;o<b.length-4;o++){if(b[o]===0xFF&&(b[o+1]&0xE0)===0xE0){const ver=(b[o+1]>>3)&3,sri=(b[o+2]>>2)&3,base=[44100,48000,32000][sri];if(base&&ver!==1){r.sr=ver===3?base:ver===2?base/2:base/4;r.ch=(b[o+3]>>6)===3?1:2;break}}}}
    else{let j=findBytes(b,"alac");if(j>=0)r.codec="ALAC";else{j=findBytes(b,"mp4a");if(j>=0)r.codec="AAC"}
      if(j>=0&&j+30<b.length){r.ch=(b[j+20]<<8)|b[j+21];const bits=(b[j+22]<<8)|b[j+23];r.sr=(b[j+28]<<8)|b[j+29];if(r.codec==="ALAC")r.bits=bits;
        if(r.codec==="ALAC"){const k=findBytes(b.subarray(j+8),"alac");if(k>=0){const o=j+8+k+4+4;if(o+24<b.length){r.bits=b[o+5]||r.bits;const sr2=((b[o+20]<<24)|(b[o+21]<<16)|(b[o+22]<<8)|b[o+23])>>>0;if(sr2>7999&&sr2<800000)r.sr=sr2}}}}}
  }catch(e){}
  if(!(r.sr>7999&&r.sr<800000))r.sr=0;if(!(r.bits>0&&r.bits<=32))r.bits=0;return r}
function setTech(){const el=$("#tech");if(!el)return;
  if(mode==="radio"&&station){el.textContent=[station.codec||"",station.bitrate?station.bitrate+" kbps":""].filter(Boolean).join(" · ");return}
  if(mode!=="local"||!cur){el.textContent="";return}
  const t=curTech,d=audio.duration;const kb=d&&curSize?Math.round(curSize*8/d/1000):0;
  if(!t){el.textContent=kb?kb+" kbps":"";return}

  {label:T("Mergi la album"),go:()=>{const l=sortTracks(tracks.filter(x=>albumId(x)===albumId(t)));rstack=[rstack[0]];rPush(rSongs(l,t.album))}}])}
function rEq(){return rList(T("Egalizator"),()=>{const it=[{label:T("Egalizator"),r:eq.on?T("PORNIT"):T("OPRIT"),go:()=>{eq.on=!eq.on;saveEq();applyEq();rRefresh()}}];
  if(eq.param)it.push({label:T("Profil căști (AutoEQ)"),r:eq.on&&eq.mode==="param"?"●":"",go:()=>{eq.mode="param";eq.on=true;saveEq();applyEq();rRefresh()}});
  Object.keys(EQ_P).forEach(n=>it.push({label:T(n),r:eq.on&&eq.mode!=="param"&&eq.preset===n?"●":"",go:()=>{eq.mode="graphic";eq.preset=n;eq.gains=EQ_P[n].slice();eq.on=true;saveEq();applyEq();rRefresh()}}));
  it.push({label:T("Importă profil AutoEQ…"),go:()=>eqImportSheet()});it.push({label:T("Grafic 10 benzi")+" · "+T("Setări"),go:()=>eqSheet()});return it})}
function rSleep(){return rList(T("Timer de somn"),()=>[[T("Oprit"),0],[T("15 minute"),15],[T("30 minute"),30],[T("45 minute"),45],[T("60 minute"),60],[T("Final piesă"),"end"]]
  .map(([l,v])=>({label:l,go:()=>{setSleep(v);toast(v?T("Timer: ")+l:T("Timer oprit"));rPop()}})))}
function rThemes(){return rList(T("Temă"),()=>THEMES.map(t=>({label:t.label,r:theme===t.id?"●":"",go:()=>applyTheme(t.id)})))}

function rRender(){if(!isRetro())return;const v=rTop();$("#rTitle").textContent=v.title;$("#aTitle").textContent=v.title;
  $("#rHint").textContent=v.kind==="np"&&mode==="radio"?T("posturi"):T("listă");
  if(v.kind==="np")rRenderNP();else{v.items=v.build();v.sel=Math.min(v.sel,Math.max(0,v.items.length-1));rRenderList(v)}rState()}
function rRefresh(){if(!isRetro())return;const v=rTop();if(v.kind==="list"){v.items=v.build();v.sel=Math.min(v.sel,Math.max(0,v.items.length-1));rRenderList(v)}else rFillNP();rState()}
function rRenderList(v){if(v.carousel&&isVelour())return rRenderCarousel(v);const el=$("#rView");el.innerHTML="";const fr=document.createDocumentFragment();
  v.items.forEach((it,i)=>{const d=h("div","rrow"+(i===v.sel?" sel":""));d.dataset.i=i;d.appendChild(h("span","l",it.label));
    d.appendChild(h("span","r",it.r!=null&&it.r!==""?String(it.r):(it.go?"›":"")));fr.appendChild(d)});
  el.appendChild(fr);rScroll()}
function rScroll(){const r=$("#rView").children[rTop().sel];if(r&&r.scrollIntoView)r.scrollIntoView({block:"nearest"})}
function rMove(d){const v=rTop();if(v.kind!=="list"||!v.items.length)return;const ns=Math.max(0,Math.min(v.items.length-1,v.sel+d));if(ns===v.sel)return;
  if(v.carousel&&isVelour()){v.sel=ns;rCarUpdate();return}
  const el=$("#rView");if(el.children[v.sel])el.children[v.sel].classList.remove("sel");if(el.children[ns])el.children[ns].classList.add("sel");v.sel=ns;rScroll();
  if(v.items.length>=30){const L=$("#rLetter");L.textContent=initial(v.items[ns].label);L.hidden=false;clearTimeout(rLetterT);rLetterT=setTimeout(()=>{L.hidden=true},700)}}
function rActivate(){const v=rTop();if(v.kind==="np"){const qc=rQCur();if(rq.sel!=null&&rq.sel>=0&&rq.sel!==qc&&rq.sel<rQItems().length){if(mode==="local"){qi=rq.sel;loadAndPlay(true)}else if(mode==="radio")playStation(radioList,rq.sel);return}if(playing())toggle();rFillNP();return}
  const it=v.items[v.sel];if(it&&it.go)it.go()}
function rHold(){const v=rTop();if(v.kind==="np"){if(mode==="local"&&cur)rPush(rOpts(cur));else if(mode==="radio"&&station){toggleRadioFav(station);rFillNP()}return true}const it=v.items[v.sel];if(it&&it.hold){it.hold();return true}return false}
function rRenderNP(){$("#rView").innerHTML='<div class="rnp"><div class="rcount" id="rI"></div><div class="rnp-top"><div class="rart" id="rArt">♪</div><div class="rmeta"><div class="t" id="rT"></div><div class="a" id="rA"></div><div class="d" id="rL"></div></div></div>'+
  '<div class="rprog" id="rProg"><i id="rP"></i></div><div class="rtimes"><span id="rC"></span><span id="rR"></span></div>'+
  '<div class="ricons"><button class="ric" id="rRep" aria-label="'+T("Repetare")+'"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg></button>'+
  '<button class="ric" id="rFav" aria-label="'+T("Favorit")+'"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.4-9.3-9.2C1.5 8 3.6 4.5 7.1 4.5c2 0 3.5 1.1 4.9 2.9 1.4-1.8 2.9-2.9 4.9-2.9 3.5 0 5.6 3.5 4.4 6.8-1.8 4.8-9.3 9.2-9.3 9.2z"/></svg></button>'+
  '<button class="ric" id="rShuf" aria-label="'+T("Shuffle")+'"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button></div>'+
  '<div class="rst"><span id="rM"></span></div><div class="rtech" id="rTech"></div><div class="rqueue" id="rQueue"></div></div>';
  $("#rProg").addEventListener("click",e=>{if(mode!=="local"||!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration});
  $("#rRep").addEventListener("click",()=>{unlock();repeat={off:"all",all:"one",one:"off"}[repeat];saveModes();rFillNP()});
  $("#rFav").addEventListener("click",()=>{unlock();if(mode==="local"&&cur)toggleFav(cur);else if(mode==="radio"&&station)toggleRadioFav(station);rFillNP()});
  $("#rShuf").addEventListener("click",()=>{unlock();shuffle=!shuffle;saveModes();rebuildQueue();rFillNP()});
  $("#rQueue").addEventListener("click",e=>{const r=e.target.closest(".rq");if(!r)return;unlock();const i=+r.dataset.i;if(i===rQCur())return;rq.sel=i;rQRender();rActivate()});
  rq.key=null;rNPfor=null;rFillNP();rQRender(true)}
function rImg(box,u,key){if(!u)return;const im=new Image();im.alt="";im.referrerPolicy="no-referrer";im.onload=()=>{if(rNPfor===key){box.innerHTML="";box.appendChild(im)}};im.src=u}
function rFillNP(){if(!isRetro()||rTop().kind!=="np"||!$("#rT"))return;setTech();
  if(mode==="radio"&&station){$("#rT").textContent=station.name;$("#rA").textContent=station.tags||"Radio";$("#rL").textContent=T("Radio live");
    $("#rI").textContent="LIVE";$("#rM").textContent="";const k="r:"+station.id;if(rNPfor!==k){rNPfor=k;$("#rArt").innerHTML="♪";rImg($("#rArt"),station.favicon,k)}}
  else if(mode==="local"&&cur){$("#rT").textContent=cur.title;$("#rA").textContent=T(cur.artist);$("#rL").textContent=T(cur.album);$("#rI").textContent=(qi+1)+T(" din ")+queue.length;
    $("#rM").textContent=[favs.has(cur.id)?"♥":"",shuffle?T("SHUFFLE"):"",{off:"",all:T("REPETĂ"),one:T("REPETĂ 1")}[repeat]].filter(Boolean).join(" · ");
    const k="t:"+cur.id,t=cur;if(rNPfor!==k){rNPfor=k;$("#rArt").innerHTML="♪";artFor(t).then(u=>rImg($("#rArt"),u,k))}}
  else{$("#rT").textContent=T("Nimic în redare");$("#rA").textContent="";$("#rL").textContent=""}
  const rr=$("#rRep");if(rr){rr.classList.toggle("on",repeat!=="off");rr.dataset.one=repeat==="one"?"1":"";
    $("#rFav").classList.toggle("on",mode==="local"&&cur?favs.has(cur.id):(mode==="radio"&&station?isRadioFav(station):false));$("#rShuf").classList.toggle("on",shuffle)}
  rTick(true);auraSync();rQRender()}
let rTickLast=0;
function rTick(force){if(!isRetro()||!rstack.length||rTop().kind!=="np")return;if(isEink()&&force!==true){const n=Date.now();if(n-rTickLast<2000)return;rTickLast=n}const p=$("#rP");if(!p)return;
  if(mode==="radio"){p.style.width="100%";$("#rC").textContent="";$("#rR").textContent=""}
  else{const d=audio.duration,c=audio.currentTime;p.style.width=(d?c/d*100:0)+"%";$("#rC").textContent=fmt(c);$("#rR").textContent="-"+fmt((d||0)-c)}
  const tt=$("#tech");$("#rTech").textContent=tt?tt.textContent:""}
function rState(){if(!isRetro())return;$("#retro").classList.toggle("live",mode==="radio");if(isAura()){$("#aPlay").innerHTML=audio.paused?I.play:I.pause;$("#aShuf").classList.toggle("on",shuffle);
  $("#aRep").classList.toggle("on",repeat!=="off");$("#aRep").dataset.one=repeat==="one"?"1":"";aTick();const v=rTop();if(v&&v.kind==="list"&&!v.carousel)auraSync()}$("#retro").classList.toggle("paused",audio.paused);$("#rState").textContent=(sleepAt||sleepEnd?"z ":"")+(!playing()?"■":audio.paused?"❚❚":"▶");
  $("#rCount").textContent=tracks.length+(tracks.length===1?T(" piesă"):T(" piese"))}
function rSync(){if(!isRetro()||!rstack.length)return;rState();const v=rTop();if(v.kind==="np")rFillNP();else if(v===rstack[0])rRefresh()}
function rStep(d){const v=rTop();if(v.kind==="np"){const n=rQItems().length;if(n){const base=rq.sel!=null&&rq.sel>=0?rq.sel:Math.max(0,rQCur());rq.sel=Math.max(0,Math.min(n-1,base+d));rQRender()}}else rMove(d)}
/* Now Playing: the current album / playlist / station list, scrollable with the roller, OK plays the highlighted one */
const rq={sel:null,key:null,seen:null};
function rQItems(){return mode==="local"?queue.map(t=>({label:t.title,id:t.id})):(mode==="radio"?radioList.map(x=>({label:x.name,id:x.id})):[])}
function rQCur(){return mode==="local"&&cur?qi:(mode==="radio"&&station?radioList.findIndex(x=>x.id===station.id):-1)}
function rQRender(force){const box=$("#rQueue");if(!box)return;const items=rQItems(),c=rQCur();
  const key=mode+"|"+items.map(i=>i.id).join(",");
  if(rq.seen!==mode+":"+c){rq.seen=mode+":"+c;rq.sel=c}
  if(force||rq.key!==key){rq.key=key;box.innerHTML="";const fr=document.createDocumentFragment();
    items.forEach((it,i)=>{const d=h("div","rrow rq");d.dataset.i=i;d.appendChild(h("span","l",it.label));d.appendChild(h("span","r",""));fr.appendChild(d)});box.appendChild(fr)}
  [...box.children].forEach((el,i)=>{el.classList.toggle("sel",i===rq.sel);el.classList.toggle("now",i===c);el.lastChild.textContent=i===c?(audio.paused?"❚❚":"♪"):""});
  const sEl=box.children[rq.sel];if(sEl){const bt=box.getBoundingClientRect(),et=sEl.getBoundingClientRect();if(et.top<bt.top)box.scrollTop+=et.top-bt.top;else if(et.bottom>bt.bottom)box.scrollTop+=et.bottom-bt.bottom}}
(function(){
  $("#rView").addEventListener("click",e=>{unlock();if(rHeld){rHeld=false;return}const row=e.target.closest(".rrow");if(!row)return;const v=rTop();if(v.kind!=="list")return;
    const i=+row.dataset.i;if(i!==v.sel){const a=$("#rView").children[v.sel];if(a)a.classList.remove("sel");row.classList.add("sel");v.sel=i}rActivate()});
  let rHeld=false,ht=0;
  $("#rView").addEventListener("pointerdown",e=>{const row=e.target.closest(".rrow");if(!row||rTop().kind!=="list")return;rHeld=false;clearTimeout(ht);
    ht=setTimeout(()=>{const v=rTop();const i=+row.dataset.i;const a=$("#rView").children[v.sel];if(a)a.classList.remove("sel");row.classList.add("sel");v.sel=i;if(rHold())rHeld=true},550)});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>$("#rView").addEventListener(ev,()=>clearTimeout(ht)));
  $("#rView").addEventListener("scroll",()=>clearTimeout(ht),{passive:true});
  $("#rView").addEventListener("contextmenu",e=>e.preventDefault());
  const k=(id,fn)=>$(id).addEventListener("click",()=>{unlock();fn()});
  k("#rkPrev",prev);k("#rkNext",()=>next(false));k("#rkPlay",toggle);k("#rkMenu",rPop);
  let okT=0,okF=false;const ok=$("#rkOk");
  ok.addEventListener("pointerdown",()=>{okF=false;clearTimeout(okT);okT=setTimeout(()=>{if(rHold())okF=true},550)});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>ok.addEventListener(ev,()=>clearTimeout(okT)));
  ok.addEventListener("click",()=>{unlock();if(okF){okF=false;return}rActivate()});ok.addEventListener("contextmenu",e=>e.preventDefault());
  let mT=0;const mk=$("#rkMenu");mk.addEventListener("pointerdown",()=>{clearTimeout(mT);mT=setTimeout(()=>{rstack=[rstack[0]];rRender()},700)});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>mk.addEventListener(ev,()=>clearTimeout(mT)));
  const ro=$("#rRoller");let rx=0,acc=0,drag=false,lx=0;const STEP=20;
  let moved=0,x0=0,t0=0,holdT=0,held=false;
  ro.addEventListener("pointerdown",e=>{drag=true;lx=x0=e.clientX;acc=0;moved=0;t0=Date.now();held=false;unlock();try{ro.setPointerCapture(e.pointerId)}catch(_){}
    clearTimeout(holdT);holdT=setTimeout(()=>{if(drag&&moved<8){held=true;rHold()}},550)});
  ro.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-lx;lx=e.clientX;moved=Math.max(moved,Math.abs(e.clientX-x0));
    if(moved>=8)clearTimeout(holdT);rx+=dx;ro.style.setProperty("--rx",rx+"px");acc+=dx;
    while(acc>=STEP){acc-=STEP;rStep(1)}while(acc<=-STEP){acc+=STEP;rStep(-1)}});
  /* a tap on the roller (no drag) works like OK; holding it works like holding OK */
  ro.addEventListener("pointerup",()=>{clearTimeout(holdT);const tap=drag&&moved<8&&!held&&Date.now()-t0<550;drag=false;acc=0;if(tap)rActivate()});
  ro.addEventListener("pointercancel",()=>{clearTimeout(holdT);drag=false;acc=0});
  ro.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();unlock();rActivate()}});
  ro.addEventListener("wheel",e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;rx-=d/2;ro.style.setProperty("--rx",rx+"px");rStep(d>0?1:-1)},{passive:false});
  document.addEventListener("keydown",e=>{if(!isRetro())return;const key=e.key;
    if(key==="ArrowDown"||key==="PageDown"){e.preventDefault();rStep(1)}else if(key==="ArrowUp"||key==="PageUp"){e.preventDefault();rStep(-1)}
    else if(key==="Enter"){e.preventDefault();unlock();rActivate()}else if(key==="Escape"||key==="Backspace"){e.preventDefault();rPop()}
    else if(key===" "){e.preventDefault();unlock();toggle()}else if(key==="ArrowRight")next(false);else if(key==="ArrowLeft")prev()});
})();

/* ---------------- Aura theme: background and colors follow the album art ---------------- */
let auraKey=null;
function palette(url){return new Promise(res=>{if(!url)return res(null);const im=new Image();if(!/^blob:|^data:/.test(url))im.crossOrigin="anonymous";
  im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=24;const x=c.getContext("2d");x.drawImage(im,0,0,24,24);
    const d=x.getImageData(0,0,24,24).data,px=[];
    for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));px.push({r,g,b,s:sat,l})}
    let vib=px.filter(p=>p.l>.18&&p.l<.82).sort((a,b)=>b.s-a.s);if(!vib.length)vib=px.slice();
    const top=vib.slice(0,Math.max(4,Math.floor(vib.length*.15)));
    const a=top.reduce((t,p)=>[t[0]+p.r,t[1]+p.g,t[2]+p.b],[0,0,0]).map(v=>Math.round(v/top.length));
    const far=vib.find(p=>Math.abs(p.r-a[0])+Math.abs(p.g-a[1])+Math.abs(p.b-a[2])>140)||vib[Math.floor(vib.length/2)]||{r:a[0],g:a[1],b:a[2]};
    res(["rgb("+a.join(",")+")","rgb("+far.r+","+far.g+","+far.b+")"])}catch(e){res(null)}};
  im.onerror=()=>res(null);im.src=url})}
function auraApply(u){const bg=$("#abg"),img=$("#abgImg"),R=$("#retro");
  bg.classList.remove("pulse");void bg.offsetWidth;bg.classList.add("pulse");
  if(u){img.style.opacity="0";img.onload=()=>{img.style.opacity=".85"};img.src=u;img.hidden=false}else img.hidden=true;
  palette(u).then(p=>{if(!isAura())return;if(!p){R.style.removeProperty("--a1");R.style.removeProperty("--a2");return}R.style.setProperty("--a1",p[0]);R.style.setProperty("--a2",p[1])})}
function auraSync(){if(!isAura()||!rstack.length)return;const v=rTop();let t=null;
  if(v.kind==="list"&&v.carousel){const it=v.items[v.sel];t=it&&it.al?it.al.tracks[0]:null}
  if(!t&&mode==="local"&&cur)t=cur;
  if(!t&&mode==="radio"&&station){const k="r:"+station.id;if(auraKey!==k){auraKey=k;auraApply(station.favicon||null)}return}
  if(!t)return;const k="a:"+albumId(t);if(auraKey===k)return;auraKey=k;artFor(t).then(u=>{if(auraKey===k)auraApply(u)})}
function aTick(){if(!isAura())return;$("#retro").classList.toggle("live",mode==="radio");const f=$("#aFill");if(!f)return;
  if(mode==="local"&&cur){const d=audio.duration,c=audio.currentTime;f.style.width=(d?c/d*100:0)+"%";$("#aC").textContent=fmt(c);$("#aR").textContent="-"+fmt((d||0)-c)}
  else{f.style.width="0%";$("#aC").textContent="0:00";$("#aR").textContent="-0:00"}}
(function(){
  const k=(id,fn)=>$(id).addEventListener("click",()=>{unlock();fn();rState();if(rTop()&&rTop().kind==="np")rFillNP()});
  k("#aBack",rPop);k("#aHome",()=>{rstack=[rstack[0]];rRender()});
  k("#aPrev",prev);k("#aNext",()=>next(false));k("#aPlay",toggle);
  k("#aShuf",()=>{shuffle=!shuffle;saveModes();rebuildQueue();toast(T(shuffle?"Shuffle pornit":"Shuffle oprit"))});
  k("#aRep",()=>{repeat={off:"all",all:"one",one:"off"}[repeat];saveModes();toast(T({off:"Repetare oprită",all:"Repetă tot",one:"Repetă piesa"}[repeat]))});
  $("#aProg").addEventListener("click",e=>{if(mode!=="local"||!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;aTick()});
})();

/* ---------------- misc ---------------- */
let toastT=0;function toast(m){const t=isRetro()?$("#rToast"):$("#toast");$("#toast").hidden=true;$("#rToast").hidden=true;t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2400)}
function makeIcon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#F0619D");g.addColorStop(1,"#7A1E52");x.fillStyle=g;x.fillRect(0,0,180,180);
  x.strokeStyle="rgba(255,255,255,.95)";x.lineWidth=10;x.lineCap="round";[30,48,66].forEach(r=>{x.beginPath();x.arc(90,90,r,-.9,.9);x.stroke();x.beginPath();x.arc(90,90,r,Math.PI-.9,Math.PI+.9);x.stroke()});
  x.fillStyle="#fff";x.beginPath();x.arc(90,90,12,0,7);x.fill();
  const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}}

(async function boot(){
  const m=ls("rola.modes");if(m){shuffle=!!m.shuffle;repeat=m.repeat||"off"}
  const f=ls("rola.favs");if(Array.isArray(f))favs=new Set(f);
  const p=ls("rola.plays");if(p&&typeof p==="object")plays=p;
  const rf=ls("rola.radiofavs");if(Array.isArray(rf))radioFavs=rf;
  const ac=ls("rola.artcache");if(ac&&typeof ac==="object")artCache=ac;
  const eqs=ls("rola.eq");if(eqs&&Array.isArray(eqs.gains)&&eqs.gains.length===10){eq=Object.assign({mode:"graphic",param:null},eqs);if(eq.mode==="param"&&!eq.param)eq.mode="graphic"}
  const rq=ls("rola.radioq");if(typeof rq==="number")radioMinKbps=rq;
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  if(eq.on)applyEq();
  const st=ls("rola.settings");if(st&&typeof st==="object")settings=Object.assign(settings,st);
  render();
  try{db=await idbOpen();const all=await op("meta","readonly",s=>s.getAll());tracks=sortTracks(all||[]);
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
  catch(e){toast(T("Stocarea locală e blocată în acest browser"))}
  const last=ls("rola.last");
  if(last&&last.station){useEl(elRadio);mode="radio";station=last.station;radioList=radioFavs.length?radioFavs.slice():[station]}
  else if(last&&last.id){const i=tracks.findIndex(t=>t.id===last.id);if(i>=0){mode="local";baseList=tracks.slice();queue=baseList.slice();qi=i;cur=tracks[i];resume={id:cur.id,t:+last.t||0};updateMedia()}}
  applyTheme(ls("rola.theme")||"auto");
})();
})();
